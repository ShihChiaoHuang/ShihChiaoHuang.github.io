<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>詩喬軒 - 水墨藝術作品集</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500&family=Noto+Serif+TC:wght@400;500;600&display=swap" rel="stylesheet">
  
  <style>
    /* CSS 完全不變，維持最佳視覺與 Safari 修正 */
    :root { --bg-color: #f7f6f2; --text-main: #2c2c2a; --text-muted: #888885; --accent-color: #5a5a5a; --font-serif: 'Noto Serif TC', serif; --font-sans: 'Noto Sans TC', sans-serif; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: var(--bg-color); color: var(--text-main); font-family: var(--font-sans); -webkit-font-smoothing: antialiased; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E"); }
    a { text-decoration: none; color: inherit; }

    .navbar { display: flex; justify-content: space-between; align-items: center; padding: 2rem 4rem; }
    .logo { font-family: var(--font-serif); font-size: 1.8rem; font-weight: 600; letter-spacing: 4px; }
    .nav-links { display: flex; gap: 3rem; font-size: 0.9rem; font-weight: 500; letter-spacing: 1px; }
    .nav-links a { position: relative; padding-bottom: 4px; transition: color 0.3s ease; }
    .nav-links a:hover { color: var(--accent-color); }
    .nav-links a.active { border-bottom: 1px solid var(--text-main); }

    .hero { text-align: center; padding: 3rem 2rem 4rem; }
    .hero h1 { font-family: var(--font-serif); font-size: 3.2rem; font-weight: 500; letter-spacing: 0.15em; margin-bottom: 1rem; }
    .hero p { color: var(--text-muted); font-size: 1.1rem; letter-spacing: 0.05em; margin-bottom: 3.5rem; }
    .filters { display: flex; justify-content: center; flex-wrap: wrap; gap: 1.5rem; }
    .filter-btn { background: none; border: 1px solid transparent; padding: 0.6rem 1.5rem; font-family: var(--font-sans); font-size: 0.9rem; color: var(--text-muted); cursor: pointer; border-radius: 30px; transition: all 0.3s ease; letter-spacing: 1px; }
    .filter-btn:hover { color: var(--text-main); }
    .filter-btn.active { color: var(--text-main); border: 1px solid var(--text-main); }

    .gallery-container { max-width: 1400px; margin: 0 auto; padding: 0 3rem 6rem; column-count: 3; column-gap: 2rem; }
    @media (max-width: 1024px) { .gallery-container { column-count: 2; } }
    @media (max-width: 600px) { .gallery-container { column-count: 1; padding: 0 1.5rem 4rem; } }

    .gallery-item { display: inline-block; width: 100%; margin-bottom: 2rem; position: relative; overflow: hidden; border-radius: 4px; animation: fadeIn 0.8s ease-in-out; -webkit-transform: translateZ(0); transform: translateZ(0); }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .gallery-item img { width: 100%; display: block; transition: transform 0.7s cubic-bezier(0.165, 0.84, 0.44, 1); }
    .gallery-item:hover img { transform: scale(1.06); }

    .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(26, 26, 24, 0.75); -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px); opacity: 0; visibility: hidden; transition: all 0.4s ease; display: flex; flex-direction: column; justify-content: flex-end; padding: 2.5rem; color: white; cursor: pointer; }
    .gallery-item:hover .overlay { opacity: 1; visibility: visible; }
    .overlay-content { transform: translateY(20px); transition: transform 0.4s ease; }
    .gallery-item:hover .overlay-content { transform: translateY(0); }

    .work-title { font-family: var(--font-serif); font-size: 1.6rem; font-weight: 500; letter-spacing: 2px; margin-bottom: 8px; }
    .work-meta { font-size: 0.85rem; color: #d1d1d1; letter-spacing: 1px; margin-bottom: 1.5rem; display: flex; gap: 10px; align-items: center; }
    .work-meta span::after { content: '|'; margin-left: 10px; color: #888; }
    .work-meta span:last-child::after { content: ''; }

    .btn-view { display: inline-block; padding: 0.5rem 1.2rem; border: 1px solid rgba(255,255,255,0.4); border-radius: 20px; font-size: 0.8rem; letter-spacing: 1px; transition: background 0.3s, border 0.3s; pointer-events: none; }
    .gallery-item:hover .btn-view { background: white; color: #2c2c2a; border-color: white; }

    .lightbox { display: none; position: fixed; z-index: 999; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.85); -webkit-backdrop-filter: blur(5px); backdrop-filter: blur(5px); opacity: 0; transition: opacity 0.3s ease; }
    .lightbox.show { display: flex; flex-direction: column; justify-content: center; align-items: center; opacity: 1; }
    .lightbox-content { max-width: 90%; max-height: 80vh; box-shadow: 0 4px 20px rgba(0,0,0,0.5); border-radius: 4px; }
    .lightbox-caption { margin-top: 15px; color: #f7f6f2; font-family: var(--font-serif); font-size: 1.2rem; letter-spacing: 2px; }
    .lightbox-close { position: absolute; top: 30px; right: 40px; color: white; font-size: 40px; font-weight: 300; cursor: pointer; transition: color 0.3s ease; }
    .lightbox-close:hover { color: #ccc; }

    footer { border-top: 1px solid rgba(0,0,0,0.06); padding: 4rem; text-align: center; font-size: 0.9rem; color: var(--text-muted); letter-spacing: 1px; }
    .footer-email { font-family: var(--font-serif); font-size: 1.2rem; color: var(--text-main); display: block; margin-bottom: 1rem; }
    @media (max-width: 768px) { .navbar { flex-direction: column; gap: 1.5rem; padding: 1.5rem; } }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="logo">詩喬軒</div>
    <div class="nav-links">
      <a href="../index.html">首頁</a>
      <a href="gallery.html" class="active">作品集</a>
      <a href="generic.html">關於我</a>
    </div>
  </nav>

  <header class="hero">
    <h1>水墨與膠彩創作</h1>
    <p>外師造化，中得心源</p>
    <div class="filters" id="filters">
      <button class="filter-btn active" data-filter="all">全部 ALL</button>
      <button class="filter-btn" data-filter="karesansui">枯山水 KARE-SANSUI</button>
      <button class="filter-btn" data-filter="landscape">山水景 LANDSCAPE</button>
      <button class="filter-btn" data-filter="nature">花鳥走獸 FLORA & FAUNA</button>
      <button class="filter-btn" data-filter="humanities">人文意象 HUMANITIES</button>
    </div>
  </header>

  <!-- 這裡被清空了，稍後會由 JS 自動生成填入 -->
  <main class="gallery-container" id="gallery"></main>

  <!-- 燈箱結構 -->
  <div id="lightbox" class="lightbox">
    <span class="lightbox-close">&times;</span>
    <img class="lightbox-content" id="lightbox-img">
    <div id="lightbox-caption" class="lightbox-caption"></div>
  </div>

  <footer>
    <a href="mailto:apple0922737762@gmail.com" class="footer-email">apple0922737762@gmail.com</a>
    <p>&copy; 2026 Shih-Chiao Huang. All Rights Reserved.</p>
  </footer>

<script>
    document.addEventListener("DOMContentLoaded", function() {
      
      const galleryContainer = document.getElementById('gallery');

      // 定義分類的英文對照表
      const categoryMapping = {
        "山水景": "landscape",
        "枯山水": "karesansui",
        "人文意象": "humanities",
        "花鳥走獸": "nature"
      };

      // ==========================================
      // 1. 動態讀取 Source of Truth (image_list.json)
      // ==========================================
      fetch('../image_list.json')
        .then(response => {
          if (!response.ok) throw new Error('無法讀取 JSON');
          return response.json();
        })
        .then(rawFileNames => {
          
          // 2. 解析 JSON 並生成 HTML
          rawFileNames.forEach(filename => {
            const nameWithoutExt = filename.replace(/\.[^/.]+$/, "");
            const parts = nameWithoutExt.split('_');
            
            if (parts.length >= 3) {
              const typeRaw = parts[0];   
              const title = parts[1];     
              const medium = parts[2];    
              
              const filterClass = categoryMapping[typeRaw] || "humanities";

              const itemHTML = `
                <div class="gallery-item" data-category="${filterClass}">
                  <img src="../images/thumbs/${filename}" data-full="../images/fulls/${filename}" alt="${title}">
                  <div class="overlay">
                    <div class="overlay-content">
                      <div class="work-title">${title}</div>
                      <div class="work-meta"><span>${typeRaw}</span><span>${medium}</span></div>
                      <span class="btn-view">查看詳情</span>
                    </div>
                  </div>
                </div>
              `;
              galleryContainer.insertAdjacentHTML('beforeend', itemHTML);
            }
          });

          // 3. HTML 生成完畢後，綁定「分類篩選」與「燈箱」的事件
          bindGalleryEvents();
        })
        .catch(error => {
          console.error("載入畫廊資料失敗：", error);
          galleryContainer.innerHTML = '<p style="text-align:center; grid-column: 1/-1;">畫廊資料載入中，請稍後再試或重新整理網頁。</p>';
        });


      // ==========================================
      // 把事件綁定邏輯包裝成函式，確保在資料載入後才執行
      // ==========================================
      function bindGalleryEvents() {
        // --- 篩選器功能 ---
        const filterBtns = document.querySelectorAll('.filter-btn');
        const galleryItems = document.querySelectorAll('.gallery-item');

        filterBtns.forEach(btn => {
          btn.addEventListener('click', function() {
            filterBtns.forEach(b => b.classList.remove('active'));
            this.classList.add('active');

            const targetCategory = this.getAttribute('data-filter');

            galleryItems.forEach(item => {
              const itemCategory = item.getAttribute('data-category');
              if (targetCategory === 'all' || targetCategory === itemCategory) {
                item.style.display = 'inline-block'; 
                item.style.animation = 'none';
                item.offsetHeight; 
                item.style.animation = 'fadeIn 0.8s ease-in-out';
              } else {
                item.style.display = 'none';
              }
            });
          });
        });

        // --- 燈箱 (Lightbox) 功能 ---
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const lightboxCaption = document.getElementById('lightbox-caption');
        const closeBtn = document.querySelector('.lightbox-close');

        document.querySelectorAll('.overlay').forEach(overlay => {
          overlay.addEventListener('click', function(e) {
            e.stopPropagation(); 
            const item = this.closest('.gallery-item');
            const imgElement = item.querySelector('img');
            
            const imgSrc = imgElement.getAttribute('data-full'); 
            const title = item.querySelector('.work-title').innerText;

            lightboxImg.src = imgSrc;
            lightboxCaption.innerText = title;
            lightbox.classList.add('show');
          });
        });

        closeBtn.addEventListener('click', () => lightbox.classList.remove('show'));
        lightbox.addEventListener('click', (e) => {
          if (e.target === lightbox) lightbox.classList.remove('show');
        });
      }

    });
  </script>
</body>
</html>
