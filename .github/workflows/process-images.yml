name: Process and Compress Raw Images

on:
  push:
    paths:
      - 'images/raw/**'
  workflow_dispatch:

jobs:
  process-images:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: sudo apt-get update && sudo apt-get install -y imagemagick jq

      - name: Process Images and Atomic JSON Generation
        run: |
          # 1. 徹底清空舊有的生成檔，確保完全 Atomic 覆寫，不留殘留檔案
          rm -rf images/fulls images/thumbs
          mkdir -p images/fulls images/thumbs
          
          cd images/raw
          shopt -s nullglob
          json_array="[]"
          
          for img in *; do
            [ -f "$img" ] || continue 
            
            basename="${img%.*}"
            target_name="${basename}.jpg"
            
            echo "Processing $img..."
            
            # 直接轉檔 (因為前面已經清空，所以必定全新生成)
            convert "$img" -resize "2000x2000>" -quality 82 "../fulls/$target_name"
            convert "$img" -resize "800x800>" -quality 75 "../thumbs/$target_name"
            
            # 更新 JSON 清單
            json_array=$(jq --arg v "$target_name" '. += [$v]' <<< "$json_array")
          done
          
          cd ../../
          echo "$json_array" > image_list.json
          echo "Generated image_list.json successfully!"

      - name: Commit and Push
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # 2. 使用 -A (All) 確保 git 記錄到「被改名或被刪除的舊檔」
          git add -A images/fulls images/thumbs image_list.json
          
          if ! git diff --staged --quiet; then
            git commit -m "Auto-process images and sync states (Atomic overwrite) [skip ci]"
            git push
          else
            echo "No changes to commit."
          fi